services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lp_tracker
      POSTGRES_USER: lp_tracker
      POSTGRES_PASSWORD: lp_tracker_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lp_tracker -d lp_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
